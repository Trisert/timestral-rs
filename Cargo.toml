[package]
name = "timestral"
version = "0.1.0"
edition = "2021"
description = "CPU inference engine for the Timestral time-series foundation models"
license = "Apache-2.0"

[dependencies]
matrixmultiply = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
